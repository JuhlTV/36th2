<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>36th Storm Corps | Login</title>
    <meta name="description" content="Sicherheitszugang zum 36th Storm Corps Tactical Network." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="hud-body" data-page="login.html">
    <div class="starfield" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="hud-shell login-shell">
      <section class="hud-panel reveal login-panel">
        <p class="hdr-kicker">Republic Security Node</p>
        <h1>36TH ACCESS LOGIN</h1>
        <p class="hdr-sub">Authentifiziere dich fuer das Tactical Command Network.</p>

        <form id="login-form" class="hud-form login-form">
          <label>Benutzername
            <input id="login-user" type="text" required autocomplete="username" />
          </label>
          <label>Passwort
            <input id="login-pass" type="password" required autocomplete="current-password" />
          </label>
          <button class="module-link button-like" type="submit">Login ausfuehren</button>
          <p class="note">Demo-Account: texer / republic36</p>
          <p id="login-error" class="login-error hidden">Zugangsdaten ungueltig oder Session abgelaufen.</p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
